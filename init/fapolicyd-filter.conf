# ---------------------------------------------------------------------------
# Overview of the default fapolicyd-filter.conf
#
# Decision flow
#   1.  Rules are read top-to-bottom.  Leading “+” means the path is
#       considered essential and will be added to the trust database;
#       leading “-” means the path is skipped.
#   2.  Indentation creates a parent-child relationship.  A child rule
#       refines the decision of its parent.  Think “allow everything
#       under /usr/, then deny one sub-tree, then allow one file type
#       back in”, etc.
#   3.  If no child matches, a directory parent's decision stands.
#       A parent without a trailing slash supplies no fallback decision.
#
# What the shipped rules do
#   • Start with “+ /”             → everything allowed by default.
#   • Deny /usr/include/ entirely.                      (- usr/include/)
#   • Deny /usr/share/ but re-allow developer artefacts:
#         *.py  *.pl  etc
#   • Deny /usr/src/kernel*/       except:
#         */scripts/*   and   */tools/objtool/*
#   • Deny html, md, conf, and other non-executable files
#
# For full syntax see:  man 5 fapolicyd-filter.conf
# ---------------------------------------------------------------------------

+ /
 - usr/include/
 - usr/share/
  # Python byte code
  + *.py?
  # Python text files
  + *.py
  # Some apps have a private bin
  + */bin/*
  # Some apps have a private libexec
  + */libexec/*
  # Ruby
  + *.rb
  # Perl
  + *.pl
  # System tap
  + *.stp
  # Javascript
  + *.js
  # QML - KDE's javascript-like language
  + *.qml
  # Polkit Javascript rules
  + polkit-1/rules.d/*.rules
  # GNOME Javascript applications without a file extension
  + gnome-shell/org.gnome.*
  + org.gnome.Characters/org.gnome.Characters
  # Java archive
  + *.jar
  # M4
  + *.m4
  # PHP
  + *.php
  # Perl Modules
  + *.pm
  # Lua
  + *.lua
  # Java
  + *.class
  # Typescript
  + *.ts
  # Typescript JSX
  + *.tsx
  # Lisp
  + *.el
  # Compiled Lisp
  + *.elc
  # Allow Lmod to run in bash profiles.d/modules.sh
  + lmod/*/bash
 # Drop all source (kernel/nvidia)
 - usr/src/*/
  # Drop script sources before allowing the remaining scripts. Keep these
  # as siblings: a file glob with children provides no fallback inclusion.
  - */scripts/*.c
  - */scripts/*.h
  # Allow scripts and tools
  + */scripts/*
  + */tools/objtool/*
 # Drop any xz 
 - *.xz
 # Drop any html
 - *.html
 # Drop any json
 - *.json
 # Drop any markdown
 - *.md
 # Drop any configuration
 - *.conf
 # drop png files scattered all over
 - *.png
